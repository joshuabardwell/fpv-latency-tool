[project]
name = "fpv-latency-tool"
version = "0.2.1"
description = "Glass-to-glass latency analyzer for FPV video systems"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.6",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyqtgraph>=0.13",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-qt>=4.4",
    "pyinstaller>=6.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=core --cov=ui --cov-report=term-missing"

[tool.coverage.run]
omit = ["tests/*", "main.py"]
